<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickNotes — Netxperts Docker Lab</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;background:#f4f6fb;color:#1b2333}
  h1{margin-bottom:4px} .sub{color:#5a6478;margin-top:0}
  form{display:flex;gap:8px;margin:20px 0} input{flex:1;padding:10px;border:1px solid #c5ccd9;border-radius:6px}
  button{padding:10px 18px;border:0;border-radius:6px;background:#1d63ed;color:#fff;cursor:pointer}
  li{background:#fff;padding:10px 14px;margin:6px 0;border-radius:6px;list-style:none;box-shadow:0 1px 2px #0001}
  ul{padding:0} .meta{font-size:12px;color:#5a6478} #health{font-size:13px;padding:8px;background:#fff;border-radius:6px}
</style>
</head>
<body>
<h1>QuickNotes</h1>
<p class="sub">If you can see this page and add a note, your containers are talking to each other.</p>
<div id="health">Checking API…</div>
<form id="f"><input id="t" maxlength="280" placeholder="Write a note…" required><button>Add</button></form>
<p class="meta" id="stats"></p>
<ul id="notes"></ul>
<script>
async function load(){
  try{
    const h = await (await fetch('/api/health')).json();
    document.getElementById('health').textContent =
      `API: ${h.api} · DB: ${h.database} · Redis: ${h.redis} · version: ${h.version} · served by: ${h.container}`;
    const notes = await (await fetch('/api/notes')).json();
    document.getElementById('notes').innerHTML = notes.map(n =>
      `<li>${n.text.replace(/</g,'&lt;')}<div class="meta">#${n.id} · ${n.created_at}</div></li>`).join('');
    const s = await (await fetch('/api/stats')).json();
    document.getElementById('stats').textContent = `${s.total_notes} notes · ${s.page_views} page views (counted in Redis)`;
  }catch(e){ document.getElementById('health').textContent = 'Cannot reach the API — check your nginx proxy and network!'; }
}
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  await fetch('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:document.getElementById('t').value})});
  document.getElementById('t').value=''; load();
};
load();
</script>
</body>
</html>
