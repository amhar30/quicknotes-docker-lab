server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TODO: Forward every request that starts with /api/ to the API container.
    # The API listens on port 5000. What hostname do you use for another
    # container? (Hint: it is NOT localhost — think "Compose service name".)
    location /api/ {
        proxy_pass http://api:5000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
