# =====================================================================
# TASK 3 — Wire the 4 services together with Docker Compose
#   frontend (nginx)  ->  api (flask)  ->  db (postgres) + redis
# Read the assignment sheet for the full requirement list.
# =====================================================================
name: quicknotes

services:
    frontend:
      build: ./frontend
      image: ${DOCKERHUB_USER}/quicknotes-frontend:${APP_VERSION}

      ports:
        - "8080:80"

      depends_on:
        api:
          condition: service_healthy

      networks:
        - public

    api:
      build: ./api
      image: ${DOCKERHUB_USER}/quicknotes-api:${APP_VERSION}

      environment:
        DB_HOST: db
        DB_NAME: ${DB_NAME}
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        REDIS_HOST: redis
        APP_VERSION: ${APP_VERSION}

      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy

      networks:
        - public
        - private

      deploy:
        resources:
          limits:
            cpus: "0.5"
            memory: 256M

      restart: unless-stopped

    db:
      image: postgres:16-alpine

      environment:
        POSTGRES_DB: ${DB_NAME}
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}

      volumes:
        - pgdata:/var/lib/postgresql/data

      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 3s
        retries: 10

      networks:
        - private

    redis:
      image: redis:7-alpine

      command: redis-server --appendonly yes

      volumes:
        - redisdata:/data

      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 3s
        retries: 10

      networks:
        - private

volumes:
  pgdata:
  redisdata:

networks:
  public:
  private:
    internal: true